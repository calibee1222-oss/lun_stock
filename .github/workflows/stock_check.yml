name: Stock Monitor Alert

on:
  schedule:
    # 台灣 12:45 (UTC 04:45)：台股 13:30 收盤前，預留 GitHub 排程延遲
    - cron: '45 4 * * 1-5'
    # 台灣 21:00 (UTC 13:00)：美股開盤前，用前一晚收盤價判斷
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write   # 允許把儀表板資料 docs/data.json 存回 repo

jobs:
  check-market:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行監控與分析
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py

      - name: 更新儀表板資料
        if: always()
        run: |
          [ -f docs/data.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "更新儀表板資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash && git push
